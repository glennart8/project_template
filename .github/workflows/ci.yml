name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Testerna kräver riktig Postgres; en överhoppad svit är inte en grön svit.
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Installera beroenden
        working-directory: backend
        run: uv sync --locked

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Tester
        working-directory: backend
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installera beroenden
        working-directory: frontend
        run: npm ci

      - name: Bygg
        working-directory: frontend
        run: npm run build

  # Fångar en trasig Dockerfile innan den når servern.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bygg driftens images
        run: POSTGRES_PASSWORD=ci docker compose -f docker-compose.prod.yml build
