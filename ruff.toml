line-length = 100
target-version = "py312"
# Alembic genererar migrationerna. De läses igenom, men lintas inte.
extend-exclude = ["backend/migrations/versions"]

[lint]
# E,F,W = fel och stil. I = importordning. UP = modern Python.
# DTZ = tider utan tidszon, använd clock.py.
select = ["E", "F", "I", "W", "UP", "DTZ"]
ignore = ["E501"]

[lint.isort]
known-first-party = [
    "api", "auth", "clock", "config", "database", "dependencies", "errors",
    "models", "repositories", "routers", "schemas", "seed", "services",
]
