line-length = 100
target-version = "py312"

[lint]
# E,F,W = fel och stil. I = importordning. UP = modern Python.
# DTZ = tider utan tidszon, använd clock.py.
select = ["E", "F", "I", "W", "UP", "DTZ"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["api", "clock", "config", "core", "database", "modules", "seed"]
