# Utveckling. För drift, se docker-compose.prod.yml.
#
#   docker compose up -d --build   hela systemet på http://localhost:8080,
#                                  direkt efter kloning — ingen .env behövs
#   docker compose up -d db        bara databasen, när du kör backend och
#                                  frontend själv med omladdning

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Bara localhost, för testsviten och psql på din dator. Båda
      # loopback-adresserna: `localhost` provar IPv6 först och hänger annars.
      # Krockar porten med ett annat projekt: sätt DB_PORT i .env (se .env.example).
      - "127.0.0.1:${DB_PORT:-5432}:5432"
      - "[::1]:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Startar om efter ett tillfälligt fel, t.ex. om databasen inte hann bli klar.
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Inuti Docker heter databasen `db`, inte localhost.
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      # Ingen Application Proxy lokalt: en fast testanvändare, med rollen admin.
      AUTH_MODE: mock
      MOCK_GROUPS: '["dev-admin"]'
      ADMIN_GROUP: dev-admin
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
      - "[::1]:${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
